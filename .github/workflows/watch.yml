name: watch

on:
  schedule:
    # 10分ごと。毎時0分など混む時刻は GitHub 側で遅延・間引きされやすいので、4分ずらしている
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:
    inputs:
      ping:
        description: "変化がなくても Slack にテスト投稿する"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_MENTION: "<@U0BGUB2NG3T>"  # 検知時に通知を鳴らす相手（Slack のユーザーID）
        run: python watch/check.py ${{ inputs.ping && '--ping' || '' }}
      - name: save state
        run: |
          git add watch/state.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="kyushu-watch" -c user.email="actions@github.com" commit -q -m "watch: 状態を更新"
          for i in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 5
          done
          exit 1
